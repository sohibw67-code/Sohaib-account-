<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohaib pro</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background-color: #0b132b; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; padding: 15px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1c2541; padding-bottom: 10px; }
    h1 { color: #48cae4; margin: 0; font-size: 24px; }
    nav button { background-color: #1c2541; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 14px; }
    nav button.active { background-color: #00b4d8; }
    .card { background-color: #1c2541; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 12px; }
    .card p { margin: 0; color: #a0aec0; font-size: 14px; }
    .card h2 { margin: 5px 0 0 0; font-size: 22px; }
    .client-item { background-color: #1c2541; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .client-name { font-weight: bold; font-size: 16px; margin: 0; }
    .client-phone { color: #a0aec0; font-size: 12px; display: block; }
    .badge-red { color: #e53e3e; font-weight: bold; }
    .badge-green { color: #38a169; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Sohaib pro</h1>
    <nav>
      <button id="btn-home" class="active" onclick="switchTab('home')">الرئيسية</button>
      <button id="btn-clients" onclick="switchTab('clients')">العملاء</button>
    </nav>
  </header>

  <!-- تبويب الرئيسية -->
  <main id="tab-home" style="margin-top: 20px;">
    <div class="card">
      <p>صافي المستحق الإجمالي</p>
      <h2 style="color: #48cae4;" id="net-total">6.75 ر.ي</h2>
    </div>
    <div class="card">
      <p>إجمالي الديون (عليه)</p>
      <h2 style="color: #e53e3e;" id="total-debt">12.40 ر.ي</h2>
    </div>
    <div class="card">
      <p>إجمالي الدائنين (له)</p>
      <h2 style="color: #38a169;" id="total-credit">5.65 ر.ي</h2>
    </div>
  </main>

  <!-- تبويب العملاء -->
  <main id="tab-clients" class="hidden" style="margin-top: 20px;">
    <h3>قائمة العملاء (2)</h3>
    <div class="client-item">
      <div>
        <p class="client-name">زيادة وعجز الصندوق</p>
        <span class="client-phone">بدون رقم</span>
      </div>
      <span class="badge-green">5.65 ر.ي (له)</span>
    </div>
    <div class="client-item">
      <div>
        <p class="client-name">عمر العميسي</p>
        <span class="client-phone">967770000000</span>
      </div>
      <span class="badge-red">12.40 ر.ي (عليه)</span>
    </div>
  </main>

  <script>
    function switchTab(tabName) {
      document.getElementById('tab-home').classList.add('hidden');
      document.getElementById('tab-clients').classList.add('hidden');
      document.getElementById('btn-home').classList.remove('active');
      document.getElementById('btn-clients').classList.remove('active');

      if (tabName === 'home') {
        document.getElementById('tab-home').classList.remove('hidden');
        document.getElementById('btn-home').classList.add('active');
      } else {
        document.getElementById('tab-clients').classList.remove('hidden');
        document.getElementById('btn-clients').classList.add('active');
      }
    }
  </script>

</body>
</html>
