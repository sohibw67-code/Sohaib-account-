<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الأذكار والصلاة</title>
  <style>
    :root {
      --primary: #1b4332;
      --secondary: #2d6a4f;
      --accent: #d4af37;
      --bg: #f8f9fa;
      --text: #212529;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 30px; }

    header {
      background-color: var(--primary);
      color: white;
      text-align: center;
      padding: 20px;
      border-bottom: 4px solid var(--accent);
    }

    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    h2 { color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 5px; }

    /* أوقات الصلاة */
    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      text-align: center;
    }
    .prayer-item {
      background: #e9ecef;
      padding: 12px;
      border-radius: 8px;
    }
    .prayer-item.active { background: var(--secondary); color: white; }
    .prayer-name { font-weight: bold; font-size: 0.9em; }
    .prayer-time { font-size: 1.1em; margin-top: 5px; }

    /* الأذكار */
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #dee2e6;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }
    .tab-btn.active { background: var(--secondary); color: white; }

    .azkar-item {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .azkar-text { font-size: 1.1em; line-height: 1.6; }
    .counter-btn {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    /* البوصلة */
    .compass-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .compass {
      width: 200px;
      height: 200px;
      border: 8px solid var(--primary);
      border-radius: 50%;
      position: relative;
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pointer {
      width: 6px;
      height: 90px;
      background: red;
      position: absolute;
      top: 10px;
      transform-origin: bottom center;
      transition: transform 0.2s ease-out;
    }

    button.btn-action {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>تطبيق الأذكار وأوقات الصلاة</h1>
  </header>

  <div class="container">

    <!-- قسم أوقات الصلاة -->
    <div class="card">
      <h2>مواقيت الصلاة اليوم</h2>
      <p id="location-status" style="font-size:0.9em; color:#666; margin-bottom:10px;">جاري جلب الموقع...</p>
      <div class="prayer-grid" id="prayer-times">
        <div class="prayer-item"><div class="prayer-name">الفجر</div><div class="prayer-time" id="Fajr">--:--</div></div>
        <div class="prayer-item"><div class="prayer-name">الشروق</div><div class="prayer-time" id="Sunrise">--:--</div></div>
        <div class="prayer-item"><div class="prayer-name">الظهر</div><div class="prayer-time" id="Dhuhr">--:--</div></div>
        <div class="prayer-item"><div class="prayer-name">العصر</div><div class="prayer-time" id="Asr">--:--</div></div>
        <div class="prayer-item"><div class="prayer-name">المغرب</div><div class="prayer-time" id="Maghrib">--:--</div></div>
        <div class="prayer-item"><div class="prayer-name">العشاء</div><div class="prayer-time" id="Isha">--:--</div></div>
      </div>
    </div>

    <!-- قسم البوصلة والقبلة -->
    <div class="card compass-container">
      <h2>اتجاه القبلة</h2>
      <p style="font-size:0.85em; color:#666;">(يتطلب تفعيل الموقع ومستشعر الاتجاه على الهاتف)</p>
      <div class="compass">
        <div class="pointer" id="compass-pointer"></div>
      </div>
      <button class="btn-action" onclick="initCompass()">تفعيل البوصلة</button>
      <p id="qibla-degree" style="margin-top:10px; font-weight:bold;"></p>
    </div>

    <!-- قسم الأذكار -->
    <div class="card">
      <h2>الأذكار اليومية</h2>
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="showAzkar('sabah')">أذكار الصباح</button>
        <button class="tab-btn" onclick="showAzkar('misa')">أذكار المساء</button>
      </div>
      <div id="azkar-list"></div>
    </div>

    <!-- التذكير للإشعارات -->
    <div class="card" style="text-align: center;">
      <h2>تفعيل التذكير اليومي</h2>
      <p style="margin-bottom:10px;">احصل على تذكيرات يومية لقراءة الأذكار والدعاء.</p>
      <button class="btn-action" onclick="requestNotification()">تفعيل الإشعارات</button>
    </div>

  </div>

  <script>
    // --- بيانات الأذكار ---
    const azkarData = {
      sabah: [
        { text: "أصبحنا وأصبح الملك لله، والحمد لله ولا إله إلا الله وحده لا شريك له.", count: 1 },
        { text: "آية الكرسي: {اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...}", count: 1 },
        { text: "سبحان الله وبحمده: عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.", count: 3 },
        { text: "اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور.", count: 1 }
      ],
      misa: [
        { text: "أمسينا وأمسى الملك لله، والحمد لله ولا إله إلا الله وحده لا شريك له.", count: 1 },
        { text: "آية الكرسي: {اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...}", count: 1 },
        { text: "أعوذ بكلمات الله التامات من شر ما خلق.", count: 3 },
        { text: "اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير.", count: 1 }
      ]
    };

    let userLat = null;
    let userLng = null;
    let qiblaBearing = 0;

    // --- 1. أوقات الصلاة بناءً على الموقع ---
    function getPrayerTimes() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;
          document.getElementById('location-status').innerText = "تم تحديد موقعك بنجاح.";

          // حساب اتجاه القبلة من الموقع
          calculateQibla(userLat, userLng);

          // جلب أوقات الصلاة من API Aladhan
          fetch(`https://api.aladhan.com/v1/timings?latitude=${userLat}&longitude=${userLng}&method=4`)
            .then(res => res.json())
            .then(data => {
              const timings = data.data.timings;
              for (let prayer in timings) {
                if (document.getElementById(prayer)) {
                  document.getElementById(prayer).innerText = timings[prayer];
                }
              }
            });
        }, () => {
          document.getElementById('location-status').innerText = "تعذر الحصول على الموقع. يتم عرض أوقات الافتراضية.";
        });
      }
    }

    // --- 2. عرض الأذكار ---
    function showAzkar(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const container = document.getElementById('azkar-list');
      container.innerHTML = '';

      azkarData[type].forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'azkar-item';
        div.innerHTML = `
          <div class="azkar-text">${item.text}</div>
          <button class="counter-btn" id="btn-${type}-${index}" onclick="countDown(this, ${item.count})">
            العدد: ${item.count}
          </button>
        `;
        container.appendChild(div);
      });
    }

    function countDown(btn, max) {
      let current = parseInt(btn.getAttribute('data-current') || max);
      if (current > 0) {
        current--;
        btn.setAttribute('data-current', current);
        btn.innerText = current > 0 ? `العدد: ${current}` : "تم ✔";
        if (current === 0) btn.style.background = "#2b9348";
      }
    }

    // --- 3. حساب واتجاه القبلة والبوصلة ---
    function calculateQibla(lat, lng) {
      const makkahLat = 21.4225;
      const makkahLng = 39.8262;
      
      const phiK = makkahLat * Math.PI / 180;
      const lambdaK = makkahLng * Math.PI / 180;
      const phi = lat * Math.PI / 180;
      const lambda = lng * Math.PI / 180;

      const qibla = Math.atan2(
        Math.sin(lambdaK - lambda),
        Math.cos(phi) * Math.tan(phiK) - Math.sin(phi) * Math.cos(lambdaK - lambda)
      );

      qiblaBearing = (qibla * 180 / Math.PI + 360) % 360;
      document.getElementById('qibla-degree').innerText = `زاية القبلة: ${Math.round(qiblaBearing)}° من الشمال`;
    }

    function initCompass() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', function(event) {
          let alpha = event.alpha; // الاتجاه نحو الشمال
          if (alpha !== null) {
            // تدوير المؤشر نحو القبلة
            let pointerDegree = qiblaBearing - alpha;
            document.getElementById('compass-pointer').style.transform = `rotate(${pointerDegree}deg)`;
          }
        }, true);
      } else {
        alert("المستشعر غير مدعوم في جهازك.");
      }
    }

    // --- 4. الإشعارات التلقائية ---
    function requestNotification() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            alert("تم تفعيل الإشعارات بنجاح!");
            scheduleNotification();
          }
        });
      }
    }

    function scheduleNotification() {
      // إرسال إشعار تجريبي بعد تفعيل التذكير
      setTimeout(() => {
        new Notification("تذكير الأذكار", {
          body: "لا تنسَ قراءة أذكار اليوم والدعاء!",
          icon: "https://cdn-icons-png.flaticon.com/512/2913/2913008.png"
        });
      }, 5000); // إشعار تجريبي بعد 5 ثوانٍ
    }

    // التشغيل الأولي عند تحميل الصفحة
    window.onload = () => {
      getPrayerTimes();
      showAzkar('sabah');
    };
  </script>
</body>
</html>
