<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الأذكار والقبلة</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f392b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="الأذكار">
  <link rel="apple-touch-icon" href="[https://cdn-icons-png.flaticon.com/512/2913/2913008.png](https://cdn-icons-png.flaticon.com/512/2913/2913008.png)">

  <style>
    @import url('[https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap](https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap)');

    :root {
      --bg-color: #f0f4f1;
      --card-bg: #ffffff;
      --primary: #0f392b;
      --primary-light: #18523f;
      --accent: #d4af37;
      --text-main: #2d3748;
      --text-muted: #718096;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      text-align: center;
      padding: 30px 20px 40px;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 0 10px 20px rgba(15, 57, 43, 0.2);
    }
    header h1 { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin-bottom: 5px; }

    .install-pwa-btn {
      display: none;
      margin: 15px auto 0;
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }

    .container { max-width: 750px; margin: -20px auto 0; padding: 0 15px; position: relative; z-index: 10; }

    .card {
      background: var(--card-bg);
      padding: 22px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-right: 4px solid var(--accent);
      padding-right: 10px;
    }

    /* أوقات الصلاة */
    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 10px;
    }
    .prayer-item {
      background: #f8faf9;
      border: 1px solid #e2e8f0;
      padding: 12px 8px;
      border-radius: 14px;
      text-align: center;
    }
    .prayer-item.active { background: var(--primary); color: white; border-color: var(--primary); }
    .prayer-item.active .prayer-name { color: var(--accent); }
    .prayer-name { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .prayer-time { font-size: 1.05rem; font-weight: bold; }

    /* البوصلة */
    .compass-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
    }
    .compass-outer {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      box-shadow: 10px 10px 20px #d9d9d9, -10px -10px 20px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 15px 0;
    }
    .compass-disc {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 2px dashed var(--primary-light);
      position: absolute;
      transition: transform 0.1s linear;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .compass-mark { position: absolute; font-weight: bold; font-size: 0.8rem; color: var(--text-muted); }
    .mark-n { top: 5px; color: #e53e3e; }
    .mark-s { bottom: 5px; }
    .mark-e { right: 8px; }
    .mark-w { left: 8px; }

    .qibla-pointer {
      width: 8px;
      height: 100px;
      background: linear-gradient(to top, transparent 50%, var(--accent) 50%);
      position: absolute;
      top: 45px;
      border-radius: 4px;
    }
    .qibla-pointer::before {
      content: '🕋';
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
    }

    /* الأذكار */
    .tabs-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      padding: 8px 16px;
      background: #edf2f7;
      color: var(--text-main);
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active { background: var(--primary); color: white; }

    .azkar-card {
      background: #fdfdfd;
      border: 1px solid #edf2f7;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .azkar-text { font-size: 1.05rem; line-height: 1.8; color: #1a202c; margin-bottom: 12px; text-align: justify; }
    .azkar-footer { display: flex; justify-content: space-between; align-items: center; }
    .azkar-bless { font-size: 0.8rem; color: var(--text-muted); max-width: 70%; }
    .counter-btn {
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      cursor: pointer;
      min-width: 80px;
    }
    .counter-btn.done { background: #38a169; color: white; }

    .action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>تطبيق الأذكار والقبلة الشامل</h1>
    <p>مواقيت الصلاة، اتجاه القبلة، ومجموعة الأذكار والأدعية الكاملة</p>
    <button id="pwaInstallBtn" class="install-pwa-btn">📲 تثبيت التطبيق على الجهاز</button>
  </header>

  <div class="container">

    <!-- أوقات الصلاة -->
    <div class="card">
      <div class="card-title">مواقيت الصلاة اليومية</div>
      <p id="locationStatus" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">جاري تحديث الموقع والمواقيت...</p>
      <div class="prayer-grid">
        <div class="prayer-item" id="p-Fajr"><div class="prayer-name">الفجر</div><div class="prayer-time">--:--</div></div>
        <div class="prayer-item" id="p-Sunrise"><div class="prayer-name">الشروق</div><div class="prayer-time">--:--</div></div>
        <div class="prayer-item" id="p-Dhuhr"><div class="prayer-name">الظهر</div><div class="prayer-time">--:--</div></div>
        <div class="prayer-item" id="p-Asr"><div class="prayer-name">العصر</div><div class="prayer-time">--:--</div></div>
        <div class="prayer-item" id="p-Maghrib"><div class="prayer-name">المغرب</div><div class="prayer-time">--:--</div></div>
        <div class="prayer-item" id="p-Isha"><div class="prayer-name">العشاء</div><div class="prayer-time">--:--</div></div>
      </div>
    </div>

    <!-- البوصلة -->
    <div class="card">
      <div class="card-title">اتجاه القبلة</div>
      <div class="compass-wrapper">
        <div class="compass-outer">
          <div class="compass-disc" id="compassDisc">
            <span class="compass-mark mark-n">N</span>
            <span class="compass-mark mark-e">E</span>
            <span class="compass-mark mark-s">S</span>
            <span class="compass-mark mark-w">W</span>
            <div class="qibla-pointer" id="qiblaPointer"></div>
          </div>
        </div>
        <p id="qiblaText" style="font-size:0.9rem; font-weight:bold; margin-bottom: 12px;">ضع الهاتف في وضع أفقياً</p>
        <button class="action-btn" onclick="requestCompassPermission()">تفعيل حسّاس البوصلة</button>
      </div>
    </div>

    <!-- الأذكار -->
    <div class="card">
      <div class="card-title">الأذكار والأدعية الشاملة</div>
      <div class="tabs-container">
        <button class="tab-btn active" onclick="loadCategory('sabah', this)">أذكار الصباح</button>
        <button class="tab-btn" onclick="loadCategory('misa', this)">أذكار المساء</button>
        <button class="tab-btn" onclick="loadCategory('nom', this)">أذكار النوم</button>
        <button class="tab-btn" onclick="loadCategory('istiqath', this)">الاستيقاظ</button>
        <button class="tab-btn" onclick="loadCategory('postPrayer', this)">بعد الصلاة</button>
        <button class="tab-btn" onclick="loadCategory('ad3yah', this)">أدعية قرأنية</button>
      </div>
      <div id="azkarList"></div>
    </div>

  </div>

  <script>
    // --- 1. تسجيل الـ Service Worker لتمكين PWA والتثبيت ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker Registered'))
          .catch((err) => console.log('SW Failed', err));
      });
    }

    let deferredPrompt;
    const pwaBtn = document.getElementById('pwaInstallBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      pwaBtn.style.display = 'block';
    });

    pwaBtn.addEventListener('click', () => {
      pwaBtn.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
      }
    });

    // --- 2. الأذكار والأدعية الشاملة ---
    const azkarDatabase = {
      sabah: [
        { text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", count: 1, note: "مكافأة اليوم والحفظ من الشر" },
        { text: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ... (آية الكرسي)", count: 1, note: "من قالها حين يصبح أُجير من الجن حتى يمسي" },
        { text: "قُلْ هُوَ اللَّهُ أَحَدٌ ... وقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ... وقُلْ أَعُوذُ بِرَبِّ النَّاسِ", count: 3, note: "تكفيك من كل شيء" },
        { text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.", count: 1, note: "" },
        { text: "اللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ.", count: 1, note: "سيد الاستغفار" },
        { text: "اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلاَئِكَتَكَ وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لاَ إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ.", count: 4, note: "اعتق الله قائله من النار" },
        { text: "حَسْبِيَ اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.", count: 7, note: "كفاه الله ما أهمه من أمر الدنيا والآخرة" },
        { text: "بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلاَ فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.", count: 3, note: "لم يضره شيء" },
        { text: "رَضِيتُ بِاللَّهِ رَبّاً، وَبِالإِسْلاَمِ دِيناً، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيّاً.", count: 3, note: "كان حقاً على الله أن يرضيه يوم القيامة" },
        { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ.", count: 3, note: "تعدل أجوراً مضاعفة" }
      ],
      misa: [
        { text: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ.", count: 1, note: "" },
        { text: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ... (آية الكرسي)", count: 1, note: "حفظ من الجن حتى يصبح" },
        { text: "قُلْ هُوَ اللَّهُ أَحَدٌ ... وقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ... وقُلْ أَعُوذُ بِرَبِّ النَّاسِ", count: 3, note: "تكفيك من كل شيء" },
        { text: "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ.", count: 1, note: "" },
        { text: "اللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ.", count: 1, note: "سيد الاستغفار" },
        { text: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", count: 3, note: "لم يضره شيء في تلك الليلة" },
        { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.", count: 100, note: "حُطَّت خطاياه وإن كانت مثل زبد البحر" }
      ],
      nom: [
        { text: "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ.", count: 1, note: "الحفظ أثناء النوم" },
        { text: "اللَّهُمَّ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا، لَكَ مَمَاتُهَا وَمَحْيَاهَا، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا. اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ.", count: 1, note: "" },
        { text: "اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.", count: 3, note: "تقال عند وضع اليد تحت الخد الأيمن" },
        { text: "سُبْحَانَ اللَّهِ (33) ، وَالْحَمْدُ لِلَّهِ (33) ، وَاللَّهُ أَكْبَرُ (34)", count: 1, note: "خير للمرء من خادم" },
        { text: "قراءة خواتيم سورة البقرة: {آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ...}", count: 1, note: "من قرأهما في ليلة كفتاه" }
      ],
      istiqath: [
        { text: "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ.", count: 1, note: "عند الاستيقاظ" },
        { text: "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، رَبِّ اغْفِرْ لِي.", count: 1, note: "غُفر له، فإن دعا استُجيب له" }
      ],
      postPrayer: [
        { text: "أَسْتَغْفِرُ اللَّهَ (ثَلاَثاً)، اللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَ السَّلاَمُ، تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالإِكْرَامِ.", count: 1, note: "بعد السلام مباشرة" },
        { text: "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ، وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ.", count: 1, note: "" },
        { text: "سُبْحَانَ اللَّهِ (33)، وَالْحَمْدُ لِلَّهِ (33)، وَاللَّهُ أَكْبَرُ (33)، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ...", count: 1, note: "غفرت ثناياه وإن كانت مثل زبد البحر" }
      ],
      ad3yah: [
        { text: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.", count: 1, note: "من أجمع الأدعية" },
        { text: "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي.", count: 1, note: "" },
        { text: "رَبَّنَا لاَ تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.", count: 1, note: "" }
      ]
    };

    let userLat = null, userLng = null, qiblaBearing = 0;

    // --- 3. جلب مواقيت الصلاة والموقع ---
    function initPrayerTimes() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          document.getElementById('locationStatus').innerText = "تم إيجاد الموقع وتحديث المواقيت.";
          
          calcQibla(userLat, userLng);

          fetch(`[https://api.aladhan.com/v1/timings?latitude=$](https://api.aladhan.com/v1/timings?latitude=$){userLat}&longitude=${userLng}&method=4`)
            .then(res => res.json())
            .then(data => {
              const timings = data.data.timings;
              ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].forEach(p => {
                const el = document.getElementById(`p-${p}`);
                if (el && timings[p]) el.querySelector('.prayer-time').innerText = timings[p];
              });
            });
        }, () => {
          document.getElementById('locationStatus').innerText = "يرجى منح الإذن للموقع لتعيين القبلة والمواقيت.";
        });
      }
    }

    // --- 4. البوصلة الحقيقية ---
    function calcQibla(lat, lng) {
      const mLat = 21.4225, mLng = 39.8262;
      const phiK = mLat * Math.PI / 180, lambdaK = mLng * Math.PI / 180;
      const phi = lat * Math.PI / 180, lambda = lng * Math.PI / 180;

      const qibla = Math.atan2(
        Math.sin(lambdaK - lambda),
        Math.cos(phi) * Math.tan(phiK) - Math.sin(phi) * Math.cos(lambdaK - lambda)
      );

      qiblaBearing = (qibla * 180 / Math.PI + 360) % 360;
      document.getElementById('qiblaPointer').style.transform = `rotate(${qiblaBearing}deg)`;
    }

    function requestCompassPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(res => {
          if (res === 'granted') window.addEventListener('deviceorientation', handleOrientation);
          else alert('يلزم الإذن للوصول لبوصلة الجهاز');
        });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    function handleOrientation(e) {
      let heading = e.webkitCompassHeading || (360 - e.alpha);
      if (heading) {
        document.getElementById('compassDisc').style.transform = `rotate(${-heading}deg)`;
        document.getElementById('qiblaText').innerText = `درجة القبلة: ${Math.round(qiblaBearing)}° | الاتجاه الحالي: ${Math.round(heading)}°`;
      }
    }

    // --- 5. التنقل والعدادات ---
    function loadCategory(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const container = document.getElementById('azkarList');
      container.innerHTML = '';

      azkarDatabase[cat].forEach(item => {
        const div = document.createElement('div');
        div.className = 'azkar-card';
        div.innerHTML = `
          <div class="azkar-text">${item.text}</div>
          <div class="azkar-footer">
            <div class="azkar-bless">${item.note || ''}</div>
            <button class="counter-btn" onclick="decrementCounter(this, ${item.count})">${item.count}</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function decrementCounter(btn, initialCount) {
      let val = parseInt(btn.innerText);
      if (isNaN(val)) return;

      if (val > 1) {
        btn.innerText = val - 1;
      } else {
        btn.innerText = "تم ✔";
        btn.classList.add('done');
      }
    }

    window.onload = () => {
      initPrayerTimes();
      loadCategory('sabah', document.querySelector('.tab-btn'));
    };
  </script>
</body>
